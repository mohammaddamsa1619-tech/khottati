<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>خطتي - مولد حزم الدروس الذكي</title>
<style>
body{font-family:Arial; background:#f0f7ff; text-align:center; padding:20px}
.card{background:white; max-width:600px; margin:auto; padding:25px; border-radius:20px; box-shadow:0 10px 30px #0001}
input, select{width:90%; padding:12px; margin:8px; border-radius:10px; border:1px solid #ccc}
button{background:#0A2A5E; color:white; padding:15px 30px; border:none; border-radius:12px; font-size:18px; cursor:pointer; width:95%}
.result{margin-top:20px; text-align:right; background:#f9f9f9; padding:15px; border-radius:10px}
</style>
</head>
<body>
<div class="card">
<h1>🎒 خطتي - مولد الدروس</h1>
<select id="grade"><option>الصف الأول</option><option>الصف الثاني</option></select>
<select id="subject"><option>رياضيات</option><option>لغة عربية</option></select>
<input id="lesson" placeholder="مثال: درس الجمع حتى 10">
<button onclick="generate()">ولد الحزمة كاملة (6 ملفات) 🚀</button>
<div id="out" class="result"></div>
</div>
<script>
async function generate(){
let lesson=document.getElementById('lesson').value;
if(!lesson) return alert('اكتب اسم الدرس');
document.getElementById('out').innerHTML='⏳ جاري توليد ورقة العمل + الشرح + التلخيص + الانفوجرافيك + الخريطة الذهنية + البطاقات...';
 // هنا بنادي الـ Backend
 let res = await fetch('/api/generate', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({lesson})});
 let data = await res.json();
 document.getElementById('out').innerHTML = `
 <h3>✅ تم توليد حزمة: ${lesson}</h3>
 <p>📄 <a href="${data.worksheet}" target="_blank">تحميل ورقة العمل PDF</a></p>
 <p>📝 <a href="${data.summary}" target="_blank">تحميل التلخيص</a></p>
 <p>🎨 <a href="${data.infographic}" target="_blank">تحميل الانفوجرافيك</a></p>
 <p>🧠 <a href="${data.mindmap}" target="_blank">تحميل الخريطة الذهنية</a></p>
 <p>🃏 <a href="${data.flashcards}" target="_blank">تحميل البطاقات</a></p>
 <p>🎤 شرح المعلم: ${data.explanation}</p>
 <button>تحميل الكل ZIP - 2 دينار</button>
 `;
}
</script>
</body>
</html>
